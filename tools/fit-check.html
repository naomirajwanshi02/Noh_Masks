<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noh Masks — fit check</title>
<style>body{margin:0;padding:12px;background:#ecdfc6;color:#3b2a1c;font:13px/1.5 ui-monospace,Consolas,monospace} canvas{display:block;max-width:100%;background:#2b1e13}</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script></head>
<body>
<p>How a mask sits on MindAR's canonical face. Panels: the bare face · the mask on it (side) · mask on it (front) · the same with the jaw dropped 1.6 cm and the face 6% wider, through the landmark skinning used in AR. <code>?id=hannya</code></p>
<div id="log"></div>
<script type="module">
import * as THREE from 'three';
import { DEFS, prepareMask } from '../js/masks.js';
import { buildMask } from '../js/build.js';
import { setupLook } from '../js/look.js';
import { bindToFace, followFace } from '../js/face-fit.js';
import { positions as LM, faces } from '../js/face-model.js';

const id = new URLSearchParams(location.search).get('id') || 'koomote';
const W = 400, H = 480;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W * 4, H); r.setScissorTest(true);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
setupLook(r, scene);
const cam = new THREE.PerspectiveCamera(30, W / H, 1, 400);
cam.position.set(0, 0, 50);

function faceMesh(pts){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts.flat(), 3));
  g.setIndex(faces); g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: '#d9a98a', roughness: 0.6, side: THREE.DoubleSide }));
}
const face = faceMesh(LM);
await prepareMask(id);
const mask = buildMask(DEFS[id]);
bindToFace(mask);
const rig = new THREE.Group(); scene.add(rig);
rig.add(face);

function panel(i, yaw, withMask){
  rig.rotation.set(0.05, yaw, 0);
  if (withMask) rig.add(mask); else rig.remove(mask);
  r.setViewport(i * W, 0, W, H); r.setScissor(i * W, 0, W, H);
  r.render(scene, cam);
}
panel(0, 0.9, false);
panel(1, 1.15, true);
panel(2, 0.25, true);
// a wider face with the jaw dropped
const live = LM.map(([x, y, z]) => { const k = Math.min(1, Math.max(0, (-3.9 - y) / 1.2)); return [x * 1.06, y - 1.6 * k, z]; });
rig.remove(face);
const face2 = faceMesh(live); rig.add(face2);
followFace(mask, live);
panel(3, 0.35, true);
// how far the mask's front sits from the face, straight ahead (cm)
const ray = new THREE.Raycaster(), gaps = [];
rig.rotation.set(0, 0, 0); rig.remove(face2); rig.add(face); followFace(mask, LM); rig.updateMatrixWorld(true);
const front = mask.getObjectByName('front');
for (const [x, y] of [[0, 6], [3, 5.5], [3.2, 1], [4.6, 0], [6.2, 1], [5, -4], [2.5, -7], [0, -8.8]]){
  ray.set(new THREE.Vector3(x, y, 40), new THREE.Vector3(0, 0, -1));
  const hm = ray.intersectObject(front)[0], hf = ray.intersectObject(face)[0];
  if (hm && hf) gaps.push(`(${x},${y}) ${(hm.point.z - hf.point.z).toFixed(2)}`);
}
document.getElementById('log').textContent = `${id}: gap mask→face, cm: ` + gaps.join('  ');
window.__done = true;
</script></body></html>
